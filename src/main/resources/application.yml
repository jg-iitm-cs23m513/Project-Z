server:
  port: 8181  #  USER SERVICE PORT
  error:
    include-message: always
    include-binding-errors: always

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: user-management-service
  datasource:
    url: jdbc:postgresql://localhost:5432/USER_MANAGEMENT_DB
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}        # Use env var
    password: ${MAIL_PASSWORD}        # Use env var
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        mime:
          encoding: UTF-8

  # 🔥 GLOBAL CORS - ALL CLIENTS + DESKTOP APPS + UNKNOWN PORTS
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*:*"
      - "capacitor://localhost"
      - "capacitor://*"
      - "file://*"           # Electron Desktop Apps
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

jwt:
  private-key-passphrase: ${JWT_PRIVATE_KEY_PASSPHRASE}
  expiration: ${JWT_EXPIRATION}
  private-key-path: classpath:keys/encrypted-private.pem
  public-key-path: classpath:keys/public.pem

app:
  cors:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*:*"
      - "capacitor://localhost"
      - "capacitor://*"
      - "file://*"           # Desktop Electron support
  otp:
    length: 6
    expiry-minutes: 10
  frontend-url: http://localhost:5173

logging:
  level:
    com.jayanta.usermanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web.cors: DEBUG    #  CORS Debug logs
